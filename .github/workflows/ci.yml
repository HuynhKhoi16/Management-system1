name: Node.js CI

# Định nghĩa thời điểm CI tự động chạy
on:
  push:
    branches: [ "main", "master" ] # Chạy khi có code đẩy lên nhánh main hoặc master
  pull_request:
    branches: [ "main", "master" ] # Chạy khi có ai tạo Pull Request vào nhánh này

jobs:
  build:
    runs-on: ubuntu-latest # Thuê một máy chủ ảo chạy hệ điều hành Ubuntu miễn phí của GitHub

    steps:
    # 1. Tải mã nguồn của bạn từ GitHub xuống máy chủ ảo
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Cài đặt môi trường Node.js
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    # 3. Cài đặt các thư viện phụ thuộc của dự án (tương đương lệnh npm install)
    - name: Install dependencies
      run: npm install

    # 4. Chạy các bài kiểm thử tự động (tương đương lệnh npm test)
    - name: Run tests
      run: npm test
